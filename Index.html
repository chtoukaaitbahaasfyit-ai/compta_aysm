    // Accurate Moroccan Dirham in Words (Arabic)
    function numberToArabicWords(amount) {
      if (!amount || isNaN(amount) || amount === 0) return 'صفر درهم مغربي';
      const dirhams = Math.floor(Math.abs(amount));
      const centimes = Math.round((Math.abs(amount) - dirhams) * 100);
      let res = `${dirhams.toLocaleString('ar-MA')} درهم مغربي`;
      if (centimes > 0) res += ` و ${centimes} سنتيماً`;
      return res;
    }

          {/* MODAL 2: Recette */}
          {isRecetteModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto no-print">
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 shadow-2xl text-xs max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-sm text-emerald-800">تحصيل مدخول جديد للجمعية (71)</h3>
                  <button onClick={() => setIsRecetteModalOpen(false)} className="text-slate-400 text-lg">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const payer = document.getElementById('recPayer').value.trim();
                  const nature = document.getElementById('recNat').value;
                  const amt = parseFloat(document.getElementById('recAmt').value);
                  const meth = document.getElementById('recMeth').value;
                  const num = `REC-${db.profile.activeFiscalYear}-00${db.recettes.length + 1}`;
                  const piece = `REC-${db.profile.activeFiscalYear}-00${db.journal.length + 1}`;

                  setDb(prev => ({
                    ...prev,
                    recettes: [{ id: `rec-${Date.now()}`, receiptNumber: num, date: new Date().toISOString().split('T')[0], payer, nature, amount: amt, method: meth }, ...prev.recettes],
                    journal: [{
                      id: `j-${Date.now()}`,
                      piece,
                      date: new Date().toISOString().split('T')[0],
                      label: `تحصيل ${nature}: ${payer}`,
                      debit: amt,
                      credit: amt,
                      accountDeb: '514101',
                      accountCred: nature === 'subvention' ? '7161' : nature === 'cotisation' ? '71711' : '71831'
                    }, ...prev.journal]
                  }));

                  setIsRecetteModalOpen(false);
                  alert(`تم تحصيل المدخول بمبلغ ${amt.toLocaleString()} درهم بنجاح وقيده باليومية.`);
                }} className="space-y-3">
                  <div>
                    <label className="block font-semibold mb-1">الطرف الدافع (المنخرط / الجهة المانحة) *</label>
                    <input type="text" id="recPayer" required placeholder="مثال: منخرط، مجلس جماعي، جهة مانحة..." className="w-full p-2 border rounded-lg font-bold" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold mb-1">طبيعة المدخول *</label>
                      <select id="recNat" className="w-full p-2 border rounded-lg bg-white">
                        <option value="cotisation">اشتراكات (71711)</option>
                        <option value="subvention">منحة عمومية (7161)</option>
                        <option value="don">تبرع وهبة (71831)</option>
                        <option value="mecenat">مساهمة شركة (71832)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">المبلغ (DH) *</label>
                      <input type="number" id="recAmt" required min="1" step="0.01" placeholder="500" className="w-full p-2 border rounded-lg font-mono font-bold text-emerald-800" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">طريقة الاستلام</label>
                    <select id="recMeth" className="w-full p-2 border rounded-lg bg-white">
                      <option value="virement">تحويل بنكي</option>
                      <option value="cheque">شيك بنكي</option>
                      <option value="especes">نقداً (الصندوق)</option>
                    </select>
                  </div>
                  <div className="pt-3 border-t flex justify-end gap-2">
                    <button type="button" onClick={() => setIsRecetteModalOpen(false)} className="px-4 py-2 border rounded-lg text-slate-600">إلغاء</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-700 text-white font-bold rounded-lg shadow-xs">تسجيل المدخول</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: Direct Depense with STRICT 5000 DH Cash Rule */}
          {isDepenseModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto no-print">
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 shadow-2xl text-xs max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-sm text-rose-800">تسجيل نفقة مباشرة / فاتورة (61)</h3>
                  <button onClick={() => setIsDepenseModalOpen(false)} className="text-slate-400 text-lg">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const ben = document.getElementById('depBen').value.trim();
                  const sub = document.getElementById('depSub').value.trim();
                  const amt = parseFloat(document.getElementById('depAmt').value);
                  const meth = document.getElementById('depMeth').value;

                  // STRICT 5000 DH CASH RULE ENFORCEMENT
                  if (meth === 'especes' && amt > 5000) {
                    alert('ممنوع قانوناً وفق المخطط المحاسبي CNC (المادة 4.2):\nكل نفقة تفوق 5.000 درهم يمنع أداؤها نقداً! يجب الأداء إجبارياً بشيك بنكي مسطر أو تحويل بنكي.');
                    return;
                  }

                  const num = `DEP-${db.profile.activeFiscalYear}-00${db.depenses.length + 1}`;
                  setDb(prev => ({
                    ...prev,
                    depenses: [{ id: `dep-${Date.now()}`, pieceNumber: num, date: new Date().toISOString().split('T')[0], beneficiary: ben, notes: sub, amount: amt, method: meth }, ...prev.depenses],
                    journal: [{
                      id: `j-${Date.now()}`,
                      piece: num,
                      date: new Date().toISOString().split('T')[0],
                      label: `نفقة: ${ben} (${sub})`,
                      debit: amt,
                      credit: amt,
                      accountDeb: '6128',
                      accountCred: meth === 'especes' ? '516101' : '514101'
                    }, ...prev.journal]
                  }));

                  setIsDepenseModalOpen(false);
                  alert(`تم تسجيل النفقة بمبلغ ${amt.toLocaleString()} درهم بنجاح.`);
                }} className="space-y-3">
                  <div>
                    <label className="block font-semibold mb-1">المستفيد / الممون *</label>
                    <input type="text" id="depBen" required placeholder="مثال: متجر، محطة وقود، مكتبة..." className="w-full p-2 border rounded-lg font-bold" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">بيان النفقة *</label>
                    <input type="text" id="depSub" required placeholder="مثال: لوازم مكتبية، وقود، تغذية..." className="w-full p-2 border rounded-lg" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold mb-1">المبلغ (DH) *</label>
                      <input type="number" id="depAmt" required min="1" step="0.01" placeholder="400" className="w-full p-2 border rounded-lg font-mono font-bold text-rose-800" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">طريقة الأداء</label>
                      <select id="depMeth" className="w-full p-2 border rounded-lg bg-white">
                        <option value="especes">نقداً عبر الصندوق (≤ 5000 DH)</option>
                        <option value="cheque">شيك بنكي مسطر</option>
                        <option value="virement">تحويل بنكي</option>
                      </select>
                    </div>
                  </div>
                  <div className="pt-3 border-t flex justify-end gap-2">
                    <button type="button" onClick={() => setIsDepenseModalOpen(false)} className="px-4 py-2 border rounded-lg text-slate-600">إلغاء</button>
                    <button type="submit" className="px-4 py-2 bg-rose-700 text-white font-bold rounded-lg shadow-xs">تسجيل النفقة</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 4: Entry Manual Form */}
          {isEntryModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto no-print">
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 shadow-2xl text-xs max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-sm text-slate-900">تسجيل قيد محاسبي يدوي (Partie Double)</h3>
                  <button onClick={() => setIsEntryModalOpen(false)} className="text-slate-400 text-lg">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const lbl = document.getElementById('entLabel').value.trim();
                  const amt = parseFloat(document.getElementById('entAmt').value);
                  const deb = document.getElementById('entDeb').value;
                  const cred = document.getElementById('entCred').value;
                  const num = `OD-${db.profile.activeFiscalYear}-00${db.journal.length + 1}`;

                  setDb(prev => ({
                    ...prev,
                    journal: [{
                      id: `j-${Date.now()}`,
                      piece: num,
                      date: new Date().toISOString().split('T')[0],
                      label: lbl,
                      debit: amt,
                      credit: amt,
                      accountDeb: deb,
                      accountCred: cred
                    }, ...prev.journal]
                  }));

                  setIsEntryModalOpen(false);
                  alert(`تم تقييد السند ${num} بنجاح.`);
                }} className="space-y-3">
                  <div>
                    <label className="block font-semibold mb-1">بيان العملية *</label>
                    <input type="text" id="entLabel" required placeholder="مثال: تسوية رصيد، اقتناء أصل، تحويل داخلي..." className="w-full p-2 border rounded-lg font-bold" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">المبلغ (DH) *</label>
                    <input type="number" id="entAmt" required min="1" step="0.01" placeholder="2000" className="w-full p-2 border rounded-lg font-mono font-bold text-blue-900" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold mb-1">الحساب المدين (Débit) *</label>
                      <select id="entDeb" className="w-full p-2 border rounded-lg bg-white font-mono">
                        {CNC_ACCOUNTS.map(a => <option key={a.number} value={a.number}>{a.number} - {a.label.substring(0, 20)}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">الحساب الدائن (Crédit) *</label>
                      <select id="entCred" className="w-full p-2 border rounded-lg bg-white font-mono">
                        {CNC_ACCOUNTS.map(a => <option key={a.number} value={a.number}>{a.number} - {a.label.substring(0, 20)}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="pt-3 border-t flex justify-end gap-2">
                    <button type="button" onClick={() => setIsEntryModalOpen(false)} className="px-4 py-2 border rounded-lg text-slate-600">إلغاء</button>
                    <button type="submit" className="px-4 py-2 bg-blue-700 text-white font-bold rounded-lg shadow-xs">تقييد القيد</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 5: Printable Official Voucher A4 (سند الصرف والأمر بالأداء المالي المخصص للأرشيف والتوقيع) */}
          {printOrder && (
            <div className="fixed inset-0 z-50 bg-slate-900/85 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-4xl w-full p-6 sm:p-10 shadow-2xl space-y-6 text-xs max-h-[96vh] overflow-y-auto print-voucher">
                
                {/* Official Letterhead */}
                <div className="border-b-2 border-slate-900 pb-4 flex flex-wrap justify-between items-start gap-4">
                  <div>
                    <h2 className="text-base font-extrabold text-slate-950 uppercase">{db.profile.nameArabic}</h2>
                    <p className="text-slate-600 font-semibold text-xs mt-0.5">{db.profile.nameFrench}</p>
                    <div className="text-[11px] text-slate-600 mt-2 space-y-0.5">
                      <p>المقر الاجتماعي: {db.profile.address} - {db.profile.city}</p>
                      <p>وصل الإيداع القانوني: <strong>{db.profile.receiptNumber}</strong> (بمقتضى الظهير الشريف 1-58-376)</p>
                      <p>التعريف الضريبي IF: {db.profile.ifFiscal} | ICE: {db.profile.ice || '---'}</p>
                      <p className="font-mono">الحساب البنكي (RIB): {db.profile.rib} ({db.profile.bankName})</p>
                    </div>
                  </div>

                  <div className="text-right border-2 border-slate-900 p-3 rounded-xl bg-slate-50 min-w-[210px]">
                    <span className="text-[10px] text-slate-500 font-bold block uppercase tracking-wider">سند الصرف والأمر بالأداء</span>
                    <span className="font-mono font-bold text-lg text-blue-900 block mt-0.5">{printOrder.number}</span>
                    <div className="text-[11px] text-slate-700 mt-1 border-t pt-1">
                      <div>السنة المالية: <strong>{db.profile.activeFiscalYear}</strong></div>
                      <div>تاريخ السند: <strong>{printOrder.date}</strong></div>
                    </div>
                  </div>
                </div>

                {/* Voucher Title */}
                <div className="text-center py-2.5 bg-slate-100 border-y-2 border-slate-900">
                  <h3 className="font-extrabold text-sm tracking-wider uppercase text-slate-900">
                    سند الصرف والأمر بالأداء المالي
                  </h3>
                  <p className="text-[10px] text-slate-600 font-mono tracking-widest mt-0.5">
                    ORDRE DE DÉCAISSEMENT & MANDATEMENT DE PAIEMENT
                  </p>
                </div>

                {/* Details Table */}
                <div className="border border-slate-300 rounded-xl overflow-hidden">
                  <table className="w-full text-xs text-right border-collapse">
                    <tbody>
                      <tr className="border-b border-slate-200 bg-slate-50/60">
                        <td className="p-2.5 font-bold text-slate-600 w-1/3">المستفيد من الأداء (Bénéficiaire):</td>
                        <td className="p-2.5 font-bold text-slate-900 text-sm">{printOrder.beneficiary}</td>
                      </tr>
                      {printOrder.cinOrIce && (
                        <tr className="border-b border-slate-200">
                          <td className="p-2.5 font-bold text-slate-600">المعرف الموحد أو ب.ت.و (ICE / CIN):</td>
                          <td className="p-2.5 font-mono font-semibold text-slate-800">{printOrder.cinOrIce}</td>
                        </tr>
                      )}
                      <tr className="border-b border-slate-200">
                        <td className="p-2.5 font-bold text-slate-600">موضوع الصرف والغرض منه:</td>
                        <td className="p-2.5 font-medium text-slate-800 leading-relaxed">{printOrder.subject}</td>
                      </tr>
                      <tr className="border-b border-slate-200 bg-slate-50/60">
                        <td className="p-2.5 font-bold text-slate-600">طريقة الأداء المنفذة:</td>
                        <td className="p-2.5 font-bold text-slate-900 uppercase">
                          {printOrder.method === 'cheque' ? `شيك بنكي مسطر (${printOrder.checkNumber || '---'})` :
                           printOrder.method === 'virement' ? `تحويل بنكي (${printOrder.checkNumber || '---'})` :
                           'نقداً عبر الصندوق (Caisse ≤ 5000 DH)'}
                        </td>
                      </tr>
                      <tr className="border-b border-slate-200">
                        <td className="p-2.5 font-bold text-slate-600">الحساب المحاسبي التوجيهي (CNC):</td>
                        <td className="p-2.5 font-mono text-blue-900 font-semibold">Compte 6128 - Achats pour projets associatifs</td>
                      </tr>
                      <tr className="bg-blue-50/40">
                        <td className="p-3 font-bold text-blue-950 text-sm">المبلغ الصافي للأداء:</td>
                        <td className="p-3 font-mono font-bold text-base text-blue-900">
                          {Number(printOrder.amount).toLocaleString('fr-MA', { minimumFractionDigits: 2 })} DH
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* Amount in Arabic Words */}
                <div className="p-3 bg-slate-50 border border-slate-300 rounded-xl flex items-center justify-between">
                  <span className="text-[11px] font-bold text-slate-700">المبلغ الإجمالي بالحروف العربية التامة:</span>
                  <span className="text-xs font-extrabold text-blue-950">{numberToArabicWords(printOrder.amount)}</span>
                </div>

                {/* Legal Conformity Banner */}
                <p className="text-[10px] text-slate-500 leading-relaxed italic border-t pt-2">
                  * تم إعداد هذا السند في احترام تام لمقتضيات المخطط المحاسبي للجمعيات الصادر عن المجلس الوطني للمحاسبة (CNC Avis n°23) ولأحكام الظهير الشريف رقم 1-58-376 المنظم لحق تأسيس الجمعيات. كل أداء يفوق 5.000 درهم يمنع أداؤه نقداً ويخضع لقيد مزدوج بالدفتر اليومي.
                </p>

                {/* The 3 Mandatory Physical Signature & Stamp Blocks */}
                <div className="pt-4 border-t-2 border-slate-900">
                  <div className="text-center font-bold text-[11px] uppercase tracking-wider text-slate-700 mb-3">
                    التأشيرات والتوقيعات الرسمية لإجازة الصرف والأداء (الحفظ في الأرشيف)
                  </div>

                  <div className="grid grid-cols-3 gap-3 text-center">
                    {/* 1. Responsable Administratif */}
                    <div className="border-2 border-slate-300 rounded-xl p-3 h-40 flex flex-col justify-between bg-slate-50/30">
                      <div>
                        <div className="font-extrabold text-slate-900 text-xs">1. المسؤول الإداري</div>
                        <div className="text-[10px] text-slate-500">إعداد ومطابقة الفواتير والوثائق</div>
                        <div className="text-[11px] font-bold text-slate-800 mt-1">{db.profile.secretary || 'الإدارة'}</div>
                      </div>
                      <div className="border-t border-slate-200 pt-1 text-[10px] text-slate-400">
                        التوقيع والتاريخ: {printOrder.date}
                      </div>
                    </div>

                    {/* 2. Trésorier */}
                    <div className="border-2 border-slate-300 rounded-xl p-3 h-40 flex flex-col justify-between bg-slate-50/30">
                      <div>
                        <div className="font-extrabold text-slate-900 text-xs">2. أمين المال</div>
                        <div className="text-[10px] text-slate-500">تأشيرة توفر الاعتماد والسيولة</div>
                        <div className="text-[11px] font-bold text-slate-800 mt-1">{db.profile.treasurer}</div>
                      </div>
                      <div className="border-t border-slate-200 pt-1 text-[10px] text-slate-400">
                        التأشيرة والتوقيع
                      </div>
                    </div>

                    {/* 3. Président */}
                    <div className="border-2 border-slate-300 rounded-xl p-3 h-40 flex flex-col justify-between bg-slate-50/30">
                      <div>
                        <div className="font-extrabold text-slate-900 text-xs">3. رئيس الجمعية</div>
                        <div className="text-[10px] text-slate-500">الأمر بالصرف والأداء المالي</div>
                        <div className="text-[11px] font-bold text-slate-800 mt-1">{db.profile.president}</div>
                      </div>
                      <div className="border-t border-slate-200 pt-1 text-[10px] text-slate-400">
                        التوقيع والخاتم الرسمي (Cachet)
                      </div>
                    </div>
                  </div>
                </div>

                {/* Footer Buttons (Hidden in Print) */}
                <div className="pt-4 border-t flex justify-end gap-2 no-print">
                  <button onClick={() => setPrintOrder(null)} className="px-4 py-2 border rounded-xl text-slate-700 font-semibold">إغلاق</button>
                  <button onClick={() => window.print()} className="px-6 py-2 bg-blue-700 hover:bg-blue-600 text-white font-bold rounded-xl shadow-md flex items-center gap-1.5">
                    <span>طباعة السند الرسمي للأرشيف (A4)</span> 🖨️
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
